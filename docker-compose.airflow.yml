# Docker Compose for KLIA MLOps — Apache Airflow 3.3.2
#
# Runs two containers:
#   airflow-postgres  — Airflow's own metadata DB (separate from your Neon/klia DB)
#   airflow           — Airflow scheduler + API server + triggerer (via `standalone`)
#
# The klia project is mounted at /opt/klia-mlops inside the container.
# DATABASE_URL (Neon) is read from your project's .env file.
#
# Usage:
#   docker compose -f docker-compose.airflow.yml up --build -d
#   docker compose -f docker-compose.airflow.yml logs -f airflow
#   docker compose -f docker-compose.airflow.yml down

x-airflow-common: &airflow-common
  build:
    context: .                        # project root — Dockerfile.airflow COPYs from here
    dockerfile: airflow/Dockerfile.airflow
  env_file:
    - .env                            # loads DATABASE_URL and API_KEY from your project .env
  environment:
    # ── Airflow metadata DB (Postgres running in this Compose, NOT Neon) ─────
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow

    # ── Executor: LocalExecutor (no Redis/Celery needed for a single machine) ─
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # ── Scheduling behaviour ──────────────────────────────────────────────────
    # Paused DAGs must be manually unpaused in the UI — disable auto-pause so
    # klia_incremental_update starts running immediately on first deploy.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    # ── Web UI ────────────────────────────────────────────────────────────────
    # Secret key for session cookies — change this for any non-local deployment.
    AIRFLOW__WEBSERVER__SECRET_KEY: 'klia-dev-secret-change-me'

    # ── Default admin user (created by the image entrypoint on first start) ──
    _AIRFLOW_WWW_USER_CREATE: 'true'
    _AIRFLOW_WWW_USER_USERNAME: '${AIRFLOW_ADMIN_USERNAME:-admin}'
    _AIRFLOW_WWW_USER_PASSWORD: '${AIRFLOW_ADMIN_PASSWORD:-admin}'

    # ── klia project path ─────────────────────────────────────────────────────
    # Adds /opt/klia-mlops to Python path so klia.jobs.update is importable.
    PYTHONPATH: /opt/klia-mlops

    # ── Timezone ─────────────────────────────────────────────────────────────
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Singapore

  volumes:
    # klia project code — mounted so klia.jobs.update is importable at runtime
    - .:/opt/klia-mlops
    # DAG files — mounted separately so edits hot-reload without a rebuild
    - ./airflow/dags:/opt/airflow/dags
    # Persistent log storage
    - airflow-logs:/opt/airflow/logs

  depends_on:
    airflow-postgres:
      condition: service_healthy
  restart: unless-stopped


services:

  # ── Airflow metadata database ───────────────────────────────────────────────
  # Stores DAG run history, task states, logs index, etc.
  # Completely separate from your Neon database (which holds departures + model bundles).
  airflow-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Airflow (standalone: scheduler + api-server + triggerer in one container) ─
  airflow:
    <<: *airflow-common
    command: standalone
    ports:
      - "8080:8080"                   # Airflow UI → http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s               # give standalone time to initialise

volumes:
  airflow-postgres-data:              # Airflow metadata DB — persists across restarts
  airflow-logs:                       # Task logs — persists across restarts
